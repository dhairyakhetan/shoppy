<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EE" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/src/assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Set the theme before anything paints, so there's no flash.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
          document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#150F2E' : '#FFF8EE'
        } catch (e) {}
      })()
    </script>
    <title>SD Creations</title>
  </head>
  <body>
    <div id="app"></div>
    <script prerender type="module" src="/src/main.tsx"></script>
  </body>
</html>
